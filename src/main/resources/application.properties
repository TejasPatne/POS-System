spring.application.name=pos-system

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:pos}?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:mypassword}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.profiles.active=${ACTIVE_PROFILE:dev}

jwt.secret=${JWT_SECRET:bcf12cfaa7edb39e36898ca1a0e1124a5ca954ee1fde799e1d23498cb03b042d}

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.user=${POSTGRES_USER:postgres}
spring.flyway.password=${POSTGRES_PASSWORD:mypassword}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized